name: Publish to Maven Central

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate next semver tag (dry run)
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GHCR_TOKEN }}
          default_bump: patch
          tag_prefix: v
          release_branches: main
          dry_run: true
          initial_version: 1.0.0

      - name: Strip v prefix from tag
        id: strip
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ steps.bump.outputs.new_tag }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Update pom.xml version
        run: mvn -B versions:set -DnewVersion=${{ steps.strip.outputs.version }} -DgenerateBackupPoms=false

      - name: Commit updated pom.xml
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(release): bump pom.xml version to ${{ steps.strip.outputs.version }} [skip ci]"
          file_pattern: "**/pom.xml"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: Create and push version tag
        run: |
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

      - name: Publish to Maven Central
        run: mvn --batch-mode --no-transfer-progress deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
